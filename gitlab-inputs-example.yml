# SPDX-License-Identifier: MIT
---
spec:
  inputs:
    node_version:
      default: '24'
      description: 'Node.js version to use'

stages:
  - setup
  - test
  - build
  - lint

# All jobs share one cache keyed on the lockfile, so each stage restores the
# dependencies installed by setup instead of running in a fresh container.
default:
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
    policy: pull-push

setup:
  stage: setup
  image: node:$[[ inputs.node_version ]]
  script:
    - ./scripts/ci/setup.sh

test:
  stage: test
  image: node:$[[ inputs.node_version ]]
  script:
    - ./scripts/ci/test.sh

build:
  stage: build
  image: node:$[[ inputs.node_version ]]
  script:
    - ./scripts/ci/build.sh

lint:
  stage: lint
  image: node:$[[ inputs.node_version ]]
  script:
    - ./scripts/ci/lint.sh
