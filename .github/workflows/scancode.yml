---
name: License Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  scancode:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Scancode
        run: |
          pip install "pluggy<1.7"
          pip install scancode-toolkit

      - name: Run Scancode
        run: |
          scancode --license --csv scancode-results.csv .

      - name: Upload results
        uses: actions/upload-artifact@v6
        with:
          name: scancode-results
          path: scancode-results.csv
