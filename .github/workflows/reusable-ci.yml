---
name: Reusable CI

on:
  workflow_call:
    inputs:
      node-version:
        default: '24'
        type: string
      run-tests:
        default: true
        type: boolean

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'

      - name: Setup
        run: ./scripts/ci/setup.sh

      - name: Test
        if: ${{ inputs.run-tests }}
        run: ./scripts/ci/test.sh

      - name: Build
        run: ./scripts/ci/build.sh

      - name: Lint
        run: ./scripts/ci/lint.sh
